name: 问题反馈
description: 报告安装、页面按钮或任务执行方面的问题。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [常见问题](https://github.com/zgx949/autodl-helper/blob/main/docs/FAQ.md)。
        **不要提交 Authorization、Token、Cookie、WxPusher SPT、完整请求头或未脱敏的页面存档。**
        截图请遮盖账户信息和敏感实例信息。安全漏洞请遵循 [安全报告说明](https://github.com/zgx949/autodl-helper/blob/main/SECURITY.md)。
  - type: input
    id: script-version
    attributes:
      label: 脚本版本
      description: 可在游猴管理面板中查看。
      placeholder: 例如 1.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      placeholder: 例如 Chrome 版本号
    validations:
      required: true
  - type: input
    id: userscript-manager
    attributes:
      label: 脚本管理器及版本
      placeholder: 例如 Tampermonkey 版本号
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统
      placeholder: 例如 macOS / Windows / Linux
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 说明所处页面、点击了什么，以及是否刷新、休眠或打开了多个控制台标签页。无需为复现额外执行真实开机操作。
      placeholder: |
        1. 打开个人账户的 Pro 实例列表
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      placeholder: 你希望看到什么结果？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与脱敏错误
      description: 可填写任务面板中的错误文字。不要粘贴完整网络请求、鉴权信息、账单或私人页面存档。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 已检查以上内容和附件，不包含 Token、Cookie、Authorization 或 SPT 等密钥。
          required: true
